<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Stylish Name - 1000+ Fonts</title>
<meta name="google-site-verification" content="MVSSBQMkWtwGiIlWMhnZ2isWQk_FFL28VvSo3ae2zC" />
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#ffcc00;font-size:22px} input{width:95%;max-width:420px;padding:14px;border-radius:10px;border:2px solid #ffcc00;font-size:18px;margin:12px 0;background:#1a1a1a;color:#fff;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:700px;margin:15px auto}
.item{background:#222;padding:10px;border-radius:8px;cursor:pointer;border:1px solid #333;font-size:15px;word-break:break-all}
.item:active{background:#ffcc00;color:#000}
#count{color:#ffcc00;font-weight:bold}
</style>
</head>
<body>
<h1>🔥 FF Stylish Name - 1000+ Fonts</h1>
<small>Click to Copy | <span id="count">1000+</span> Fonts</small><br>
<input id="n" placeholder="Naam likho... ex: Mahendra" oninput="gen(this.value)">
<div class="grid" id="l"></div>
<script>
function gen(v){
if(!v) v="FF Lover";
let left=["꧁","༺","亗","◥","『","༒","★彡","☬","☠","⚔️","•°","꧁༒☬","꧁❤","꧁☠","༆","•","▲","▼","◆","●","❖","✦","ミ★","꧁✿","╰•★★","༺࿇༻","꧁•⊹٭","︻╦╤─","༄","꧁༺"];
let right=["꧂","༻","亗","◤","』","༒","ミ★","☬","☠","⚔️","°•","☬༒꧂","❤꧂","☠꧂","༆","•","▲","▼","◆","●","❖","✦","★彡","✿꧂","★★•╯","༺࿇༻","٭⊹•꧂","─╤╦︻","༄","༻꧂"];
let mid=["","ツ","™","࿐","×","父","⚔️","🔥","👑","💀","☠","⚡","💎","🎯","🏆","࿐FF","YT","OP","BOSS","KING","LEGEND","HUNTER","PRO","Gaming","Lover","FF"];
let fonts=[];
for(let i=0;i<left.length;i++){
 for(let j=0;j<mid.length;j++){
   fonts.push(`${left[i]} ${v}${mid[j]} ${right[i%right.length]}`);
   if(fonts.length>=1100) break;
 }
 if(fonts.length>=1100) break;
}
let h=""; fonts.forEach(t=>{ h+=`<div class=item onclick="navigator.clipboard.writeText(this.innerText);let x=this.innerText;this.innerText='Copied ✅';setTimeout(()=>this.innerText=x,800)">${t}</div>` });
document.getElementById("l").innerHTML=h;
document.getElementById("count").innerText=fonts.length+" Fonts";
}
gen("");
</script>
</body>
</html>
